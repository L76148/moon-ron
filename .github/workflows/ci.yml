name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check
        run: moon check --deny-warn

      - name: Test
        run: moon test --deny-warn

      - name: Format
        run: moon fmt --check

      - name: Compatibility corpus
        run: |
          moon run cmd/ron -- check corpus/basic.ron
          moon run cmd/ron -- check corpus/extensions.ron
          moon run cmd/ron -- check corpus/kitchen_sink.ron
