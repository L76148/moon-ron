name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry
        run: moon update

      - name: Check
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test
        run: moon test --deny-warn

      - name: Format
        run: moon fmt --check

      - name: Compatibility corpus
        run: |
          moon run cmd/ron -- check corpus/basic.ron
          moon run cmd/ron -- check corpus/extensions.ron
          moon run cmd/ron -- check corpus/kitchen_sink.ron
          moon run cmd/ron -- check corpus/ranges.ron
          moon run cmd/ron -- check corpus/typed_values.ron
          moon run cmd/mon -- check corpus/mon/scalars.mon
          moon run cmd/mon -- check corpus/mon/config.mon
          moon run cmd/mon -- check corpus/mon/services.mon

      - name: MON round trip
        run: |
          moon run cmd/mon -- compact corpus/mon/config.mon > /tmp/config.mon
          moon run cmd/mon -- check /tmp/config.mon
          moon run cmd/mon -- format corpus/mon/services.mon > /tmp/services.mon
          moon run cmd/mon -- check /tmp/services.mon

      - name: MON preprocessor and generated source
        run: |
          moon run cmd/mon -- expand corpus/mon/deployment.mon > /tmp/deployment.mon
          moon run cmd/mon -- check /tmp/deployment.mon
          moon run cmd/mon -- gen corpus/mon/embedded.mon config Config > cmd/embedded/generated.mbt
          moon fmt
          git diff --exit-code -- cmd/embedded/generated.mbt
          moon run cmd/embedded
